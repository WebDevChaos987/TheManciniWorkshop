<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>The Mancini Workshop&trade;</title>
    
    <style>
      body {
        background-color: #1A1A1A;
        color: #FFA500;
        font-family: "Lucida Console", "Courier New", monospace;
        text-align: center;
        padding: 20px;
      }
      h1 {
        font-size: 45px;
        color: rgb(255, 165, 0);
        /* The glow effect you created */
        text-shadow: 0 0 5px rgb(255, 165, 0), 0 0 15px rgb(255, 165, 0);
        margin-bottom: 30px;
      }
      input {
        background: #2a2a2a;
        border: 1px solid #FFA500;
        color: white;
        padding: 10px;
        width: 300px;
      }
      button {
        background-color: #FFA500;
        color: #1A1A1A;
        border: none;
        padding: 10px 20px;
        cursor: pointer;
        font-weight: bold;
        border-radius: 67px;
      }
      button:hover {
        background-color: #FF8C00;
      }
    </style>
  </head>
  
  <body>
    <header>
      <h1>The Mancini Workshop&trade;</h1>
    </header>
    
    <p style="max-width: 600px; margin: 0 auto 20px auto;">
      Welcome to The Mancini Workshop. We build websites for free. 
      Contact us via the form below, and we'll send a link or QR Code when your site is ready!
    </p>

    <footer>
      &copy; 2026 The Mancini Workshop&trade; | All Rights Reserved
    </footer>

        <form id="contactForm">
      <input id="userEmail" type="email" placeholder="Your Email Address" required><br><br>
      <textarea id="message" placeholder="Describe your website project..." rows="4" style="width: 320px; background: #2a2a2a; border: 1px solid #FFA500; color: white; padding: 10px; font-family: inherit;"></textarea><br><br>
      
      <button type="button" onclick="sendMail()">Send Request</button>  
      <button type="reset">Clear</button>
    </form>

    <script>
      function sendMail() {
        const email = document.getElementById("userEmail").value;
        const msg = document.getElementById("message").value;
        
        if(!email || !msg) {
          alert("Please fill out both your email and the project details!");
          return;
        }

        // This compiles the info and opens the Mac Mail app
        const subject = encodeURIComponent("New Website Project - Mancini Workshop");
        const body = encodeURIComponent("Client Email: " + email + "\n\nProject Details:\n" + msg);
        
        window.location.href = "mailto:karissaking94@gmail.com?subject=" + subject + "&body=" + body;
      }
    </script>
